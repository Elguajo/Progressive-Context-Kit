name: Cleanup obsolete branches

on:
  pull_request:
    branches:
      - 'build/v1.8.0-runtime'

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.event.pull_request.head.ref == 'cleanup/obsolete-branches' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'feat/phase-completion-reports'
            'feat/phase-completion-reports-v172'
            'fix/v1.8.0-runtime-empty-dirs'
            'build/v1.8.0-trigger'
            'publish/v1.8.0-trigger'
            'cleanup/obsolete-branches'
            'build/v1.8.0-runtime'
          )
          for branch in "${branches[@]}"; do
            echo "Deleting $branch"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" || true
          done
