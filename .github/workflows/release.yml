name: Build Project Runtime Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          EXPECTED="v$(cat VERSION)"
          if [[ "$GITHUB_REF_NAME" != "$EXPECTED" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($EXPECTED)" >&2
            exit 1
          fi

      - name: Build verified Project Runtime from Framework Source
        run: python3 tools/build_release.py

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(cat VERSION)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_tag.outputs.tag }}
        shell: bash
        run: |
          ASSET="$(ls dist/Progressive-Context-Project-Runtime-v*.zip | head -n 1)"
          MANIFEST="${ASSET%.zip}.manifest.json"
          CHECKSUMS="dist/SHA256SUMS.txt"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "$MANIFEST" "$CHECKSUMS" --clobber
          else
            gh release create "$TAG" "$ASSET" "$MANIFEST" "$CHECKSUMS" \
              --target "$GITHUB_SHA" \
              --title "Progressive Context $TAG" \
              --generate-notes
          fi
