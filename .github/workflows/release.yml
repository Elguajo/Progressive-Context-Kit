name: Build Project Runtime Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - VERSION
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Framework Source
        run: |
          python3 tools/behavior_contract.py
          python3 tools/framework_contract.py
          python3 tools/duplication_audit.py
          python3 tools/audit.py
          python3 -m unittest discover -s tools/tests -v
      - name: Build Project Runtime
        run: python3 tools/build_runtime.py
      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(cat VERSION)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          ASSET="$(ls dist/Progressive-Context-Project-Runtime-v*.zip | head -n 1)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --target "$GITHUB_SHA" \
              --title "Progressive Context $TAG" \
              --generate-notes
          fi
