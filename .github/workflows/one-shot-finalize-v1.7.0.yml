name: One-shot finalize v1.7.0

on:
  push:
    branches:
      - temp-finalize-v1.7.0

permissions:
  contents: write

jobs:
  finalize:
    if: github.repository == 'Elguajo/Progressive-Context-Kit'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary finalization branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: temp-finalize-v1.7.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Verify expected source state
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "1.7.0"
          git fetch origin main --tags --force
          PARENT_SHA="$(git rev-parse HEAD^)"
          MAIN_SHA="$(git rev-parse origin/main)"
          if [[ "$PARENT_SHA" != "$MAIN_SHA" ]]; then
            echo "Temporary branch is no longer a single commit ahead of main." >&2
            echo "parent=$PARENT_SHA main=$MAIN_SHA" >&2
            exit 1
          fi
          grep -Fq -- '--title "Progressive Context Kit $TAG"' .github/workflows/release.yml
          echo "main_before=$MAIN_SHA"
          echo "tag_before=$(git rev-parse refs/tags/v1.7.0)"

      - name: Canonicalize current onboarding docs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old_url = "https://github.com/Elguajo/Progressive-Context-Spec-Kit"
          new_url = "https://github.com/Elguajo/Progressive-Context-Kit"
          docs = [
              Path("README.md"),
              Path("README_RU.md"),
              Path("docs/human/GETTING_STARTED.md"),
              Path("docs/human/GETTING_STARTED.ru.md"),
          ]
          for path in docs:
              text = path.read_text(encoding="utf-8")
              text = text.replace(old_url, new_url)
              text = text.replace("Progressive Context Spec Kit", "Progressive Context Kit")
              path.write_text(text, encoding="utf-8")
          PY

          git rm .github/workflows/one-shot-finalize-v1.7.0.yml

          if git grep -n "Progressive-Context-Spec-Kit" -- README.md README_RU.md docs/human/; then
            echo "Old canonical repository URL remains in current onboarding docs." >&2
            exit 1
          fi
          if git grep -n "Progressive Context Spec Kit" -- README.md README_RU.md docs/human/ NOTICE.md docs/system/LINEAGE.md profiles/ tools/sync_profiles.py; then
            echo "Old product name remains in current user/framework surfaces." >&2
            exit 1
          fi
          git diff --check

      - name: Commit final docs and fast-forward main
        id: final
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Progressive Context Kit v1.7.0 branding"
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "sha=$FINAL_SHA" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$FINAL_SHA"

      - name: Build and verify final Project Runtime
        id: build
        shell: bash
        run: |
          set -euo pipefail
          FINAL_SHA="${{ steps.final.outputs.sha }}"
          python3 tools/build_release.py

          ASSET="dist/Progressive-Context-Project-Runtime-v1.7.0.zip"
          MANIFEST="dist/Progressive-Context-Project-Runtime-v1.7.0.manifest.json"
          CHECKSUMS="dist/SHA256SUMS.txt"
          test -f "$ASSET"
          test -f "$MANIFEST"
          test -f "$CHECKSUMS"

          python3 - "$MANIFEST" "$FINAL_SHA" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert data.get("version") == "1.7.0", data
          assert data.get("source_commit") == sys.argv[2], data
          assert data.get("source_of_truth") == "Framework Source", data
          assert data.get("generated") is True, data
          PY

          (cd dist && sha256sum -c SHA256SUMS.txt)

          TMP="$(mktemp -d)"
          unzip -q "$ASSET" -d "$TMP"
          RUNTIME_ROOT="$(find "$TMP" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$RUNTIME_ROOT"
          python3 "$RUNTIME_ROOT/.progressive/tools/audit.py" --root "$RUNTIME_ROOT"
          python3 "$RUNTIME_ROOT/.progressive/tools/context_compile.py" --root "$RUNTIME_ROOT" >/dev/null
          grep -Fq "Progressive Context Kit" "$RUNTIME_ROOT/AGENTS.md"
          grep -Fq "minimum sufficient information" "$RUNTIME_ROOT/AGENTS.md"
          grep -Fq "Correctness > Safety > Task completeness > Actionability > Concision" "$RUNTIME_ROOT/AGENTS.md"
          grep -Fq "@AGENTS.md" "$RUNTIME_ROOT/CLAUDE.md"

          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"
          echo "checksums=$CHECKSUMS" >> "$GITHUB_OUTPUT"

      - name: Move v1.7.0 tag and reissue existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          FINAL_SHA="${{ steps.final.outputs.sha }}"
          ASSET="${{ steps.build.outputs.asset }}"
          MANIFEST="${{ steps.build.outputs.manifest }}"
          CHECKSUMS="${{ steps.build.outputs.checksums }}"

          git fetch origin --tags --force
          OLD_TAG_SHA="$(git rev-parse refs/tags/v1.7.0)"
          echo "Moving v1.7.0: $OLD_TAG_SHA -> $FINAL_SHA"
          git tag -f v1.7.0 "$FINAL_SHA"
          git push --force origin refs/tags/v1.7.0

          cat > /tmp/release-notes.md <<'EOF'
          **Progressive Context Kit v1.7.0**

          **Token-Efficient · Quality-First · Spec-Driven**

          Download `Progressive-Context-Project-Runtime-v1.7.0.zip` and extract it into your project. Then start Claude Code or Codex in that directory and use `.progressive/prompts/START_NEW_PROJECT.md` to begin.

          For the full human walkthrough, see `docs/human/GETTING_STARTED.md` in the Framework Source repository. Human onboarding is intentionally excluded from the Project Runtime archive.

          This v1.7.0 release was reissued before meaningful external adoption so the public Runtime matches the final hardened and branded Framework Source for v1.7.0.

          ## Verified release build

          The release is built and verified end-to-end by `tools/build_release.py`:

          - validates Framework Source contracts, audits, profile/Skill synchronization, and the full unit test suite;
          - builds the deterministic Project Runtime archive;
          - extracts and audits the generated Runtime and runs its context compiler;
          - publishes a provenance manifest and SHA-256 checksum alongside the Runtime.

          ## Assets

          - `Progressive-Context-Project-Runtime-v1.7.0.zip` — Project Runtime to extract into a project
          - `Progressive-Context-Project-Runtime-v1.7.0.manifest.json` — build provenance and validation record
          - `SHA256SUMS.txt` — archive checksum

          **Full Changelog:** https://github.com/Elguajo/Progressive-Context-Kit/compare/v1.6.0...v1.7.0
          EOF

          gh release edit v1.7.0 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Progressive Context Kit v1.7.0" \
            --target "$FINAL_SHA" \
            --notes-file /tmp/release-notes.md

          gh release upload v1.7.0 "$ASSET" "$MANIFEST" "$CHECKSUMS" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Verify published tag, release and downloaded assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          FINAL_SHA="${{ steps.final.outputs.sha }}"

          TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.7.0" --jq .object.sha)"
          test "$TAG_SHA" = "$FINAL_SHA"

          RELEASE_TITLE="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v1.7.0" --jq .name)"
          test "$RELEASE_TITLE" = "Progressive Context Kit v1.7.0"

          VERIFY_DIR="$(mktemp -d)"
          gh release download v1.7.0 --repo "$GITHUB_REPOSITORY" --dir "$VERIFY_DIR" \
            --pattern 'Progressive-Context-Project-Runtime-v1.7.0.zip' \
            --pattern 'Progressive-Context-Project-Runtime-v1.7.0.manifest.json' \
            --pattern 'SHA256SUMS.txt'

          python3 - "$VERIFY_DIR/Progressive-Context-Project-Runtime-v1.7.0.manifest.json" "$FINAL_SHA" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert data.get("source_commit") == sys.argv[2], data
          assert data.get("version") == "1.7.0", data
          PY

          (cd "$VERIFY_DIR" && sha256sum -c SHA256SUMS.txt)

      - name: Remove temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete temp-finalize-v1.7.0
          echo "Final v1.7.0 commit: ${{ steps.final.outputs.sha }}"
